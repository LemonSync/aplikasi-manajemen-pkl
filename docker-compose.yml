version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: pkl-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD wajib diisi}
      MYSQL_DATABASE: ${DB_NAME:?DB_NAME wajib diisi}
      MYSQL_USER: ${DB_USER:?DB_USER wajib diisi}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib diisi}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pkl-backend
    environment:
      DATABASE_URL: mysql://${DB_USER:?DB_USER wajib diisi}:${DB_PASSWORD:?DB_PASSWORD wajib diisi}@mysql:3306/${DB_NAME:?DB_NAME wajib diisi}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET wajib diisi}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET wajib diisi}
      STORAGE_ROOT: /app/storage
      PORT: 4000
      NODE_ENV: production
    ports:
      - "4000:4000"
    volumes:
      - storage_data:/app/storage
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pkl-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  storage_data:
